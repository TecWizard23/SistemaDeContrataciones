services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: rrhh_laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/custom-opcache.ini
    networks:
      - rrhh_network

  nginx:
    image: nginx:alpine
    container_name: rrhh_laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - rrhh_network

  db:
    image: mariadb:10.11
    container_name: rrhh_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rrhh_evaluaciones
      MYSQL_USER: rrhh_user
      MYSQL_PASSWORD: rrhh_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rrhh_network

volumes:
  db_data:
    driver: local

networks:
  rrhh_network:
    driver: bridge